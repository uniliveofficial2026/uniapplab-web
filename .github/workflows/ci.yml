name: CI

on:
  push:
    branches: [main, master, 'stage-d/**', 'stage-c/**', 'release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync vercel.json
        run: node scripts/sync-vercel-config.mjs

      - name: Build workspace libs
        run: pnpm run typecheck:libs

      - name: Health scan
        run: node artifacts/instacollab/scripts/check-health.mjs

      - name: Typecheck api-server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Typecheck instacollab
        run: pnpm --filter @workspace/instacollab run typecheck

      - name: Stage B UniLiveRTC + platform foundation
        run: pnpm run test:stage-b

      - name: Stage C platform productization gates
        run: pnpm run test:stage-c

      - name: Stage D release / cloud / self-host gates
        run: pnpm run test:stage-d

      - name: Gift scheduler + wallet authority
        run: |
          pnpm --filter @workspace/instacollab run test:gift-scheduler
          pnpm --filter @workspace/instacollab run test:gift-storm
          pnpm --filter @workspace/instacollab run test:wallet
          pnpm --filter @workspace/instacollab run test:identity
          pnpm --filter @workspace/instacollab run test:social
          pnpm --filter @workspace/instacollab run test:media-games
          pnpm --filter @workspace/instacollab run test:marketplace-ledger
          pnpm --filter @workspace/instacollab run test:visual-lock
          pnpm --filter @workspace/instacollab run test:rtc-policy
          pnpm --filter @workspace/instacollab run test:posts-reels

      - name: Gift settle idempotency
        run: pnpm run test:gifts

      - name: Call + PK readiness
        run: |
          pnpm --filter @workspace/instacollab exec tsx --test test/call-lifecycle-state.test.mjs test/native-incoming-call-readiness.test.mjs test/pk-team-topology.test.mjs test/pk-seat-stage-a.test.mjs

      - name: Stage A security + thermal + beauty contracts
        run: |
          pnpm --filter @workspace/instacollab run test:stage-a-security-push-native
          pnpm --filter @workspace/instacollab run test:stage-a-mount-contracts
          pnpm --filter @workspace/instacollab exec tsx --test test/thermal-perception-cadence.test.mjs test/reels-thermal-preload-stage-a.test.mjs test/beauty-slo.test.mjs

      - name: API live PK challenge authority
        run: pnpm --filter @workspace/api-server run test:live-pk-challenge
