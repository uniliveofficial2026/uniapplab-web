<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=320"/>
<title>Trending now</title>
<style>
body{margin:0;font-family:system-ui;background:#f8fafc;color:#0f172a;min-height:100vh;padding:24px;max-width:320px;margin-inline:auto;box-sizing:border-box}
.word{font-weight:900;font-size:12px;opacity:.6}
h1{font-size:22px;margin:8px 0}
.sub{opacity:.7;font-size:14px}
.row{display:flex;gap:10px;overflow:auto;padding:8px 0}
.card{width:112px;border:1px solid #e2e8f0;border-radius:16px;padding:10px;text-align:center;background:#fff;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{aspect-ratio:1;background:#e2e8f0;border-radius:8px}
.live{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.live .tile{aspect-ratio:3/4;border-radius:16px;background:linear-gradient(180deg,#334155,#0f172a);color:#fff;padding:10px;position:relative}
.pill{display:inline-block;background:#ef4444;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px}
.pk{background:#e11d48;margin-left:4px}
.search{width:100%;padding:12px 14px 12px 36px;border-radius:16px;border:1px solid #e2e8f0;box-sizing:border-box}
.tabs{display:flex;gap:8px;margin:12px 0;overflow:auto}
.tab{padding:6px 14px;border-radius:999px;background:#e2e8f0;font-size:13px;font-weight:700;white-space:nowrap}
.tab.on{background:#0f172a;color:#fff}
.meta{opacity:.55;font-size:11px;margin-top:16px}
.empty{border:1px dashed #cbd5e1;border-radius:16px;padding:40px;text-align:center;color:#64748b}

</style></head><body>
<div class="word">UniLive’s</div>
<h1>Trending now</h1>
<p class="sub">Small mobile.</p>
<div class="row"><div class="card">creator</div></div>
<p class="meta">Phase 5 local preview · ~320px · default · not published · wired-with-fallback</p>
</body></html>
