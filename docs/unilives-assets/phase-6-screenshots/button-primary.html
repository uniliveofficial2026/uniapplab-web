<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=390"/>
<title>Primary button</title>
<style>
body{margin:0;font-family:system-ui;background:#f8fafc;color:#0f172a;padding:24px;max-width:390px;margin-inline:auto}
.word{font-weight:900;font-size:12px;opacity:.6}
h1{font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{padding:12px 16px;border-radius:16px;border:0;font-weight:800;font-size:13px}
.primary{background:#2563eb;color:#fff}
.secondary{background:#e2e8f0;color:#0f172a;border:1px solid #cbd5e1}
.outline{background:transparent;border:1px solid #94a3b8}
.ghost{background:transparent}
.destructive{background:#dc2626;color:#fff}
.input{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #cbd5e1;margin:6px 0}
.card{border:1px solid #e2e8f0;border-radius:16px;padding:16px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.chip{border-radius:999px;border:1px solid #e2e8f0;padding:6px 12px;font-size:12px;font-weight:700;background:#fff}
.chip.on{background:#2563eb;color:#fff;border-color:#2563eb}
.badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:#ef4444;color:#fff}
.skel{height:12px;border-radius:8px;background:#e2e8f0;margin:6px 0}
.toast{margin-top:16px;display:inline-block;background:#0f172a;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700}
.meta{opacity:.55;font-size:11px;margin-top:16px}
</style></head><body>
<div class="word">UniLive’s</div>
<h1>Primary button</h1>
<p>Canonical primary.</p>
<div class="row"><button class="btn primary">Continue</button></div>
<p class="meta">Phase 6 local preview · not published</p>
</body></html>
