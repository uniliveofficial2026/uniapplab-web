<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=390"/>
<title>Welcome back — 390 — default</title>
<style>
  body{margin:0;font-family:system-ui;background:#f8fafc;color:#0f172a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:28px 20px;max-width:390px;margin-inline:auto;box-sizing:border-box}
  .logo{width:72px;height:72px;border-radius:20px;background:#fff;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(15,23,42,.06)}
  .word{font-weight:900;letter-spacing:-.02em}
  h1{font-size:22px;margin:0;text-align:center}
  .sub{opacity:.7;text-align:center;font-size:14px;max-width:28rem;line-height:1.45}
  .card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
  .input{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;background:#fff;border-radius:12px;padding:12px 14px;font-size:15px}
  .btn{width:100%;padding:14px;border:0;border-radius:16px;background:#2563eb;color:#fff;font-weight:800}
  .btn.ghost{background:#fff;color:#2563eb;border:1px solid #e2e8f0}
  .oauth{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:16px;border:1px solid #e2e8f0;background:#fff;font-weight:600}
  .div{display:flex;align-items:center;gap:10px;opacity:.55;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .div:before,.div:after{content:"";flex:1;height:1px;background:#e2e8f0}
  .err{color:#dc2626;font-size:12px;font-weight:700}
  .ok{color:#2563eb;font-size:12px;font-weight:700}
  .legal{font-size:11px;opacity:.65;text-align:center;max-width:320px;line-height:1.45}
  .meta{opacity:.55;font-size:11px;text-align:center}
  
</style></head><body>
  <div class="logo"><img src="../../../artifacts/instacollab/public/brand/app-logo.png" width="40" height="40" alt=""/></div>
  <div class="word">UniLive’s</div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to continue on UniLive’s.</p>
  <div class="card">
  <div class="oauth">Continue with Google</div><div class="div">or email</div>
  <input class="input" placeholder="you@example.com" autocomplete="email"/>
  <input class="input" type="password" placeholder="••••••••" autocomplete="current-password"/>
  <button class="btn" type="button">Log in</button>
  <button class="btn ghost" type="button">Forgot password?</button>
  </div>
  <p class="legal">UniLive’s is for users 13+ only. Privacy Policy · Terms of Service</p>
  <p class="meta">Local Phase 3 visual preview. Viewport ~390px. Motion: default. Not published. wired-with-fallback.</p>
</body></html>
