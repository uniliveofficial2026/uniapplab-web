<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=390"/>
<title>Set up your profile — 390 — default</title>
<style>
  body{margin:0;font-family:system-ui;background:#f8fafc;color:#0f172a;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 20px;max-width:390px;margin-inline:auto;box-sizing:border-box}
  .word{font-weight:900;font-size:13px;opacity:.65}
  h1{font-size:22px;margin:0;text-align:center}
  .sub{opacity:.7;text-align:center;font-size:14px;max-width:28rem;line-height:1.45}
  .card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .avatar{width:112px;height:112px;border-radius:999px;overflow:hidden;border:2px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#64748b}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .input{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;background:#fff;border-radius:12px;padding:12px 14px;font-size:15px}
  .input.bad{border-color:#dc2626}
  .btn{width:100%;padding:14px;border:0;border-radius:16px;background:#2563eb;color:#fff;font-weight:800}
  .btn:disabled{opacity:.55}
  .link{background:none;border:0;color:#2563eb;font-size:12px;font-weight:700;cursor:pointer}
  .err{color:#dc2626;font-size:12px;font-weight:700;align-self:stretch}
  .ok{color:#2563eb;font-weight:900}
  .check{font-size:12px;align-self:stretch}
  .meta{opacity:.55;font-size:11px;text-align:center}
  
</style></head><body>
  <div class="word">UniLive’s</div>
  <h1>Set up your profile</h1>
  <p class="sub">Empty form — single-screen flow.</p>
  <div class="card">
  <div class="avatar empty">Photo</div>
  <button class="link">Upload profile photo</button>
  <input class="input" placeholder="Display name"/>
  <input class="input" placeholder="creative_you"/>
  <input class="input" placeholder="my_unique_id"/>
  <textarea class="input" placeholder="A short intro..."></textarea>
  <input class="input" placeholder="https://..."/>
  <label class="check"><input type="checkbox"/> Legal agreement</label>
  <button class="btn" disabled>Continue</button>
  </div>
  <p class="meta">Local Phase 4 preview. Viewport ~390px. Motion: default. Not published. wired-with-fallback. No interests/creator UI in current flow (not-in-phase).</p>
</body></html>
