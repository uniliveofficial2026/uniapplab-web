services:
  - type: web
    name: uniapplab-greedy-tap
    runtime: node
    plan: free
    buildCommand: cd artifacts/instacollab/vendor/greedy-tap && npm install --omit=dev
    startCommand: cd artifacts/instacollab/vendor/greedy-tap && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GAME_BASE_PATH
        value: /games/greedy-slot
