<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UniLive" />
    <meta name="theme-color" content="#020617" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('app_settings');
          var theme = 'dark';
          var s = null;
          if (raw && raw !== 'undefined') {
            s = JSON.parse(raw);
            if (s && (s.theme === 'light' || s.theme === 'dark')) theme = s.theme;
          }
          var root = document.documentElement;
          if (theme === 'dark') root.classList.add('dark');
          root.style.colorScheme = theme;
          // Instant paint colors before CSS/JS load
          document.documentElement.style.backgroundColor = theme === 'dark' ? '#020617' : '#f8fafc';
          document.documentElement.style.color = theme === 'dark' ? '#ffffff' : '#000000';
          // Custom app logo → favicon / home-screen icon before React boots
          var brandHref = null;
          try {
            var platformRaw = localStorage.getItem('platform_app_brand_remote');
            if (platformRaw) {
              var platform = JSON.parse(platformRaw);
              if (platform && typeof platform.logoUrl === 'string' && platform.logoUrl && platform.mediaType !== 'video') {
                brandHref = platform.logoUrl;
              }
            }
          } catch (e) {}
          if (!brandHref && s && typeof s.appLogoUrl === 'string' && s.appLogoUrl && s.appLogoMediaType !== 'video') {
            brandHref = s.appLogoUrl;
          }
          if (brandHref) {
            var href = brandHref;
            var icon = document.createElement('link');
            icon.rel = 'icon';
            icon.href = href;
            document.head.appendChild(icon);
            var apple = document.createElement('link');
            apple.rel = 'apple-touch-icon';
            apple.href = href;
            document.head.appendChild(apple);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/opengraph.jpg" />
    <!-- Non-blocking fonts — UI paints with system font first -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
    </noscript>
    <title>UniLive</title>
    <meta name="description" content="UniLive — create, connect, and collaborate in real time." />
    <meta property="og:title" content="UniLive" />
    <meta property="og:description" content="UniLive — create, connect, and collaborate in real time." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UniLive" />
    <meta name="twitter:description" content="UniLive — create, connect, and collaborate in real time." />
    <style>
      /* Visible before any JS — prevents blank white/black flash */
      html, body {
        margin: 0;
        min-height: 100dvh;
        background: #020617;
        color: #fff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      html:not(.dark), html:not(.dark) body {
        background: #f8fafc;
        color: #000;
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: inherit;
        color: inherit;
        z-index: 9999;
        pointer-events: none;
      }
      #boot-shell .boot-top {
        height: calc(3.25rem + env(safe-area-inset-top, 0px));
        border-bottom: 1px solid rgba(148, 163, 184, 0.25);
        flex-shrink: 0;
      }
      #boot-shell .boot-main {
        flex: 1;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      #boot-shell .boot-row {
        height: 0.75rem;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.2);
        max-width: 12rem;
      }
      #boot-shell .boot-card {
        height: 10rem;
        border-radius: 1rem;
        background: rgba(148, 163, 184, 0.15);
      }
      #boot-shell .boot-nav {
        height: calc(3.25rem + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid rgba(148, 163, 184, 0.25);
        flex-shrink: 0;
      }
      /* Boot shell stays visible until app signals ready — prevents flash between skeleton and Shell. */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Instant visible chrome while JS bundle parses/executes -->
    <div id="boot-shell" aria-hidden="true">
      <div class="boot-top"></div>
      <div class="boot-main">
        <div class="boot-row"></div>
        <div class="boot-card"></div>
        <div class="boot-card"></div>
      </div>
      <div class="boot-nav"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
