<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background gradient path -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Neon Slot Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ringGrad)" stroke-width="24" filter="url(#neonGlow)" />
  
  <!-- Golden Wheel Inner Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="16 12" />
  
  <!-- Slot Center Core -->
  <circle cx="256" cy="256" r="110" fill="#1e293b" stroke="#3b82f6" stroke-width="6" />

  <!-- Neon Casino Sparkles -->
  <path d="M 256,190 L 256,322 M 190,256 L 322,256" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" opacity="0.4" />
  
  <!-- Sparkly crown slot inside center -->
  <g transform="translate(196, 186) scale(1.8)" fill="url(#goldGrad)">
    <path d="M12 2L1 21h22L12 2zm0 4l6.5 11H5.5L12 6z" opacity="0.3"/>
    <circle cx="12" cy="13" r="4" fill="url(#goldGrad)"/>
    <path d="M12 5l1.5 3.5L17 10l-3.5 1.5L12 15l-1.5-3.5L7 10l3.5-1.5z" />
  </g>
  
  <!-- Corner golden stars -->
  <path d="M 90,90 l 6,10 l 10,2 l -8,8 l 3,12 l -11,-7 l -11,7 l 3,-12 l -8,-8 l 10,-2 z" fill="url(#goldGrad)" />
  <path d="M 422,90 l 6,10 l 10,2 l -8,8 l 3,12 l -11,-7 l -11,7 l 3,-12 l -8,-8 l 10,-2 z" fill="url(#goldGrad)" />
  <path d="M 90,422 l 6,10 l 10,2 l -8,8 l 3,12 l -11,-7 l -11,7 l 3,-12 l -8,-8 l 10,-2 z" fill="url(#goldGrad)" />
  <path d="M 422,422 l 6,10 l 10,2 l -8,8 l 3,12 l -11,-7 l -11,7 l 3,-12 l -8,-8 l 10,-2 z" fill="url(#goldGrad)" />
</svg>
