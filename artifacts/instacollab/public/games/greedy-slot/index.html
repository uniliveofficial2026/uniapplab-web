<!doctype html>

    <base href="/games/greedy-slot/" />
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('rt');
          if (q) {
            window.__GREEDY_RT__ = q.replace(/\/$/, '');
            return;
          }
          // Production shell on UniLive → direct realtime backend (WebSocket).
          if (!/localhost|127\.0\.0\.1/.test(location.hostname)) {
            window.__GREEDY_RT__ = 'https://uniapplab-greedy-tap.onrender.com';
          }
        } catch (e) {}
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

    <meta name="theme-color" content="#0f172a" />

    <link rel="manifest" href="/games/greedy-slot/manifest.json" />
    
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          String(event.reason).includes('WebSocket') || 
          String(event.reason).includes('vite') ||
          (event.reason.message && event.reason.message.includes('WebSocket'))
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('vite'))) {
          event.preventDefault();
        }
      });
      var originalConsoleError = console.error;
      console.error = function() {
        if (typeof arguments[0] === 'string' && (arguments[0].includes('[vite]') || arguments[0].includes('WebSocket'))) {
          return;
        }
        originalConsoleError.apply(console, arguments);
      };
    </script>
